name: Java CI with Maven

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 取得你的專案程式碼
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 設定 Java 環境 (使用 JDK 21)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. 執行 Maven 測試
      - name: Run Tests with Maven
        run: mvn test